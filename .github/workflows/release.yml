name: Release

# Publishes the GitHub release for a version tag pushed on main's release
# merge. Production itself deploys from main through Workers Builds; the tag
# records which commit that was.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Checkout can leave an annotated tag lightweight; fetch the real one
      # for its message.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Tag matches package.json
        run: node scripts/check-release-tag.js "$GITHUB_REF_NAME"

      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          body=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME${subject:+ · $subject}" \
            --notes "$body" --generate-notes
