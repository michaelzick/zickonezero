name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Agent brief sync
        run: npm run agent-briefs:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Contact worker install and typecheck
        run: npm ci --prefix workers/contact && npm run typecheck --prefix workers/contact

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
